name: Screenshots

# Renders the main screens on a macOS runner, so appearance changes can be reviewed
# from the PR without a Mac. Started by hand (Actions → Screenshots → Run workflow)
# to save macOS minutes; download the "screenshots" artifact from the run.
on:
  workflow_dispatch:

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build app (without bundled runtimes)
        run: LOCALSHIFT_SKIP_RUNTIME=1 ./build.sh
      - name: Capture
        run: tools/screenshots.sh "$RUNNER_TEMP/screenshots"
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
          retention-days: 14
